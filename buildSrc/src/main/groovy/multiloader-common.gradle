plugins {
    id 'java-library'
}

version = mod_version

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = uri('https://repo.spongepowered.org/repository/maven-public')
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        )
        filter { includeGroup('maven.modrinth') }
    }
}

// Every jar carries the license, named so it doesn't clash with other mods' licenses.
['jar', 'sourcesJar'].each { jarName ->
    tasks.named(jarName, Jar).configure {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
            ])
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(java_version)
}

processResources {
    var expandProps = [
        'version'                      : version,
        'group'                        : project.group,
        'minecraft_version'            : minecraft_version,
        'minecraft_version_range'      : minecraft_version_range,
        'fabric_version'               : fabric_version,
        'fabric_loader_min_version'    : fabric_loader_min_version,
        'mod_name'                     : mod_name,
        'mod_author'                   : mod_author,
        'mod_id'                       : mod_id,
        'mod_license'                  : mod_license,
        'mod_description'              : mod_description,
        'neoforge_min_version'         : neoforge_min_version,
        'neoforge_loader_version_range': neoforge_loader_version_range,
        'credits'                      : credits,
        'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
