name: Publish on GitHub, CurseForge & Modrinth

on: [ workflow_dispatch ]

env:
  MOD_NAME: "Hexed"
  VERSION: "0.8.3"
  MINECRAFT_VERSION: "1.21.1"
  # The mod targets Java 21; Gradle itself (Fabric Loom) needs a Java 25 JVM to run.
  JAVA_VERSION: 21
  GRADLE_JAVA_VERSION: 25
  VERSION_TYPE: beta

  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: |
            ${{ env.JAVA_VERSION }}
            ${{ env.GRADLE_JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Smoke Test (Fabric)
        run: ./gradlew :fabric:runGametest

      - name: Smoke Test (NeoForge)
        run: ./gradlew :neoforge:runGameTestServer

      - name: Publish (Fabric)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar

          curseforge-id: 996912
          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"

          github-tag: "v${{ env.VERSION }}+${{ env.MINECRAFT_VERSION }}"
          github-token: "${{ env.GITHUB_TOKEN }}"

          modrinth-id: wUMNoII3
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"
          modrinth-featured: true

          name: "${{ env.MOD_NAME }} ${{ env.VERSION }}+MC${{ env.MINECRAFT_VERSION }} (Fabric)"
          version: "${{ env.VERSION }}+fabric"
          version-type: "${{ env.VERSION_TYPE }}"
          changelog-file: CHANGELOG.md

          loaders: fabric
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          java: "${{ env.JAVA_VERSION }}"
          # Exactly one flame mod is required (checked at startup); Modrinth can't express "one of", so both are optional.
          dependencies: |
            fabric-api(required)
            prometheus-api(optional)
            dyed-flames(optional)

      - name: Publish (NeoForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar

          curseforge-id: 996912
          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"

          github-tag: "v${{ env.VERSION }}+${{ env.MINECRAFT_VERSION }}"
          github-token: "${{ env.GITHUB_TOKEN }}"

          modrinth-id: wUMNoII3
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"
          modrinth-featured: true

          name: "${{ env.MOD_NAME }} ${{ env.VERSION }}+MC${{ env.MINECRAFT_VERSION }} (NeoForge)"
          version: "${{ env.VERSION }}+neoforge"
          version-type: "${{ env.VERSION_TYPE }}"
          changelog-file: CHANGELOG.md

          loaders: neoforge
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          java: "${{ env.JAVA_VERSION }}"
          dependencies: |
            prometheus-api(optional)
            dyed-flames(optional)
