prometheus_neoforge_version=zedA2rPJ
cobweb_fabric_version=RDHSnisj
cobweb_neoforge_version=c10AZba0
dyedflames_fabric_version=6Hojerfo
dyedflames_neoforge_version=HcqOZDaC
puzzleslib_fabric_version=IV6k1yRp
puzzleslib_neoforge_version=kmN5PWk9
forgeconfigapiport_fabric_version=N5qzq0XV
