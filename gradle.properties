org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Mod
mod_id=hexed
mod_name=Hexed
mod_version=0.8.3
mod_author=BackupCup
mod_description=Bringing Calamity's Enchantment mechanic into Minecraft
mod_license=Timefall Development License 1.2
group=net.backupcup
credits=
java_version=21

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# Common (vanilla classes with Mojang mappings, via NeoForm)
neo_form_version=1.21.1-20240808.144430

# Fabric https://fabricmc.net/develop
fabric_loader_version=0.19.5
fabric_loader_min_version=0.16.10
fabric_version=0.116.17+1.21.1

# NeoForge https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.265
neoforge_min_version=21.1.262
neoforge_loader_version_range=[4,)

# Libraries
jankson_version=1.2.3
mixin_version=0.8.7
mixinextras_version=0.4.1
